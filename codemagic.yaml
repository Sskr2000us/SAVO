workflows:
  ios_unsigned:
    name: iOS (unsigned) - SAVO
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.savo.savo
    scripts:
      - name: Flutter pub get
        script: |
          cd apps/mobile
          flutter --version
          flutter pub get
      - name: Build iOS (no codesign)
        script: |
          cd apps/mobile
          flutter build ios --release --no-codesign
    artifacts:
      - apps/mobile/build/ios/iphoneos/*.app
      - apps/mobile/build/ios/archive/*.xcarchive
      - apps/mobile/flutter_*.log

  ios_ipa:
    name: iOS IPA (signed) - SAVO
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Must match the App Store Connect API key name configured in Codemagic UI
      # under Teams -> Integrations -> Developer Portal.
      app_store_connect: SAVO
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        # TestFlight/App Store distribution (no device UDID needed).
        distribution_type: app_store
        bundle_identifier: com.savo.savo
    scripts:
      - name: Flutter pub get
        script: |
          cd apps/mobile
          flutter --version
          flutter pub get

      - name: Apply signing settings
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          cd apps/mobile
          flutter build ipa --release
    publishing:
      app_store_connect:
        # Upload IPA to App Store Connect/TestFlight.
        auth: integration
        # Internal testing does not require beta review submission.
        submit_to_testflight: false
    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      - apps/mobile/build/ios/ipa/**/*.ipa
      - apps/mobile/build/ios/archive/*.xcarchive
      - apps/mobile/build/ios/ipa/*.dSYM.zip
      - apps/mobile/flutter_*.log
