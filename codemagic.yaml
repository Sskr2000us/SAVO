workflows:
  ios_unsigned:
    name: iOS (unsigned) - SAVO
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.savo.savo
    scripts:
      - name: Flutter pub get
        script: |
          cd apps/mobile
          flutter --version
          flutter pub get
      - name: Build iOS (no codesign)
        script: |
          cd apps/mobile
          flutter build ios --release --no-codesign
    artifacts:
      - apps/mobile/build/ios/iphoneos/*.app
      - apps/mobile/build/ios/archive/*.xcarchive
      - apps/mobile/flutter_*.log

  ios_ipa:
    name: iOS IPA (signed) - SAVO
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Must match the App Store Connect API key name configured in Codemagic UI
      # under Teams -> Integrations -> Developer Portal.
      app_store_connect: SAVO
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        # TestFlight/App Store distribution (no device UDID needed).
        distribution_type: app_store
        bundle_identifier: com.savo.savo
      vars:
        # App Center API token (add in Codemagic UI as secure environment variable)
        # APP_CENTER_API_TOKEN: Encrypted in Codemagic
        # App Center organization/owner name
        APP_CENTER_OWNER: "YOUR_APP_CENTER_OWNER"
        # App Center iOS app name
        APP_CENTER_IOS_APP: "SAVO-iOS"
    scripts:
      - name: Flutter pub get
        script: |
          cd apps/mobile
          flutter --version
          flutter pub get

      - name: Apply signing settings
        script: |
          xcode-project use-profiles \
            --archive-method app-store \
            --export-options-plist "$HOME/export_options.plist"

      - name: Build IPA
        script: |
          cd apps/mobile
          # App Store Connect requires CFBundleVersion to be strictly increasing.
          # IMPORTANT: don't derive it from git history.
          # Codemagic clones can be shallow and rebuilds of the same commit
          # (or builds from different branches) can reuse/decrease commit counts,
          # causing App Store Connect to reject the upload.
          if [ -n "$CM_BUILD_NUMBER" ]; then
            DERIVED_BUILD_NUMBER=$((10000 + CM_BUILD_NUMBER))
          else
            DERIVED_BUILD_NUMBER=$(git rev-list --count HEAD)
          fi
          echo "Using iOS build number: $DERIVED_BUILD_NUMBER (CM_BUILD_NUMBER=$CM_BUILD_NUMBER)"
          flutter build ipa --release \
            --build-number="$DERIVED_BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"

      - name: Verify IPA output
        script: |
          cd apps/mobile
          echo "Searching for .ipa under apps/mobile/build ..."
          find build -type f -name "*.ipa" -print || true
          IPA_PATH=$(find build -type f -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No .ipa was produced by 'flutter build ipa'."
            echo "Dumping build/ios output tree for diagnostics:"
            ls -R build/ios || true
            echo "Open the 'Build IPA' step logs and search for 'Built'/'xcarchive'/'export' to see why export did not happen."
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          ls -lh "$IPA_PATH" || true

          echo "Inspecting IPA Info.plist (bundle id + version/build) ..."
          rm -rf /tmp/savo_ipa_extract || true
          mkdir -p /tmp/savo_ipa_extract
          unzip -q "$IPA_PATH" -d /tmp/savo_ipa_extract
          PLIST_PATH=$(ls -1 /tmp/savo_ipa_extract/Payload/*.app/Info.plist 2>/dev/null | head -n 1)
          if [ -z "$PLIST_PATH" ]; then
            echo "WARN: Could not locate Info.plist inside IPA payload."
          else
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST_PATH" || true
          fi

      - name: Upload to App Center
        script: |
          cd apps/mobile
          IPA_PATH=$(find build -type f -name "*.ipa" | head -n 1)
          
          if [ -z "$APP_CENTER_API_TOKEN" ]; then
            echo "⚠️  APP_CENTER_API_TOKEN not set - skipping App Center upload"
            echo "To enable: Add APP_CENTER_API_TOKEN in Codemagic environment variables"
            exit 0
          fi
          
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA file found - cannot upload to App Center"
            exit 1
          fi
          
          echo "📤 Uploading to App Center..."
          echo "Owner: $APP_CENTER_OWNER"
          echo "App: $APP_CENTER_IOS_APP"
          echo "IPA: $IPA_PATH"
          
          # Install App Center CLI
          npm install -g appcenter-cli
          
          # Login with API token
          appcenter login --token "$APP_CENTER_API_TOKEN"
          
          # Upload IPA
          appcenter distribute release \
            --app "$APP_CENTER_OWNER/$APP_CENTER_IOS_APP" \
            --file "$IPA_PATH" \
            --group Collaborators \
            --release-notes "Build: $CM_BUILD_NUMBER | Commit: $CM_COMMIT | Branch: $CM_BRANCH
          
          Continuous single-item scanning:
          - Auto-capture with 3-second intervals
          - Instant confirmation for high-confidence items
          - Optimized Vision API (1-2s response time)" \
            --debug
          
          echo "✅ Successfully uploaded to App Center"
    publishing:
      app_store_connect:
        # Upload IPA to App Store Connect/TestFlight.
        auth: integration
        # Upload to TestFlight so the build shows up in App Store Connect.
        # (App Store submission/release still typically requires metadata + review in App Store Connect.)
        submit_to_testflight: true
    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      - apps/mobile/build/ios/ipa/**/*.ipa
      - apps/mobile/build/ios/archive/*.xcarchive
      - apps/mobile/build/ios/ipa/*.dSYM.zip
      - apps/mobile/flutter_*.log
